name: TS CLI

on:
  push:
    branches: [feat/typescript-rewrite]
    paths: ['cli/**', 'ui/**', '.github/workflows/ts-cli.yml']
  pull_request:
    branches: [feat/typescript-rewrite]
    paths: ['cli/**', 'ui/**', '.github/workflows/ts-cli.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts-cli:
    name: TS CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
          - os: macos-latest
            target: bun-darwin-arm64
          - os: windows-latest
            target: bun-windows-x64
    defaults:
      run:
        shell: bash
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Build UI
        working-directory: ui
        run: bun install --frozen-lockfile && bun run build
      - run: bun install --frozen-lockfile
      - name: Check (typecheck + lint)
        run: bun run check
      - name: Unit tests
        run: bun run test
      - name: Build host target
        run: bun run build ${{ matrix.target }}
      - name: Unit tests against compiled binary
        run: bun run test
      - name: Budget (size and startup)
        run: bun run budget
      - name: Cross-compile all targets and check sizes
        if: runner.os == 'Linux'
        run: |
          bun run build
          bun run budget dist/*/knowns*
