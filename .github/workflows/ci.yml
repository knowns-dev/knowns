name: CI

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    name: Lint & Test (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install llvm-mingw toolchain
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -L --retry 5 --retry-delay 5 \
            -o llvm-mingw.zip \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20260407/llvm-mingw-20260407-ucrt-x86_64.zip"
          unzip -q llvm-mingw.zip -d "$RUNNER_TEMP/llvm-mingw"
          TOOLCHAIN_DIR=$(find "$RUNNER_TEMP/llvm-mingw" -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ -z "$TOOLCHAIN_DIR" ]; then
            echo "Failed to extract llvm-mingw toolchain"
            exit 1
          fi
          echo "$TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"
          echo "CC=x86_64-w64-mingw32-clang" >> "$GITHUB_ENV"
          echo "CXX=x86_64-w64-mingw32-clang++" >> "$GITHUB_ENV"
          echo "AR=x86_64-w64-mingw32-ar" >> "$GITHUB_ENV"

      - name: Build UI
        run: cd ui && bun install --frozen-lockfile && bun run build

      - name: Run npm installer tests
        if: runner.os == 'Windows'
        run: bun test npm/knowns/install.test.js

      - name: Build Go binary (Unix)
        if: runner.os != 'Windows'
        run: make build

      - name: Build Go binary (Windows)
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: '1'
        run: go build -ldflags "-s -w -X github.com/howznguyen/knowns/internal/util.Version=${env:GITHUB_SHA}" -o bin/knowns.exe ./cmd/knowns

      # No ONNX Runtime download: github.com/yalue/onnxruntime_go was removed
      # with the local ONNX embedding path (spec ollama-only-embedding FR-2),
      # so no test needs a shared library on disk. CGO stays enabled on
      # Windows because `go test -race` requires a C toolchain, not because
      # anything in this module binds to C.

      - name: Go vet (Unix)
        if: runner.os != 'Windows'
        run: go vet ./...

      - name: Go vet (Windows)
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: '1'
        run: go vet ./...

      - name: Run tests (Unix)
        if: runner.os != 'Windows'
        run: go test -v -race -count=1 ./...

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: '1'
        run: go test -v -race -count=1 ./...

      - name: Run canonical keyword retrieval evaluation gate
        if: runner.os != 'Windows'
        run: ./bin/knowns --json eval retrieval --output "$RUNNER_TEMP/retrieval-evaluation-keyword.json"

      - name: Upload canonical keyword retrieval report
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-evaluation-keyword
          path: ${{ runner.temp }}/retrieval-evaluation-keyword.json
          if-no-files-found: error

  macos-intel:
    runs-on: macos-15-intel
    needs: [test]
    timeout-minutes: 20
    name: macOS Intel CLI Smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: oven-sh/setup-bun@v2

      - name: Build UI
        run: cd ui && bun install --frozen-lockfile && bun run build

      - name: Run platform and keyword fallback tests
        run: |
          go test ./internal/search ./internal/cli ./internal/server/routes ./internal/doctor
          go test ./internal/search -run '^TestKeywordModeUsesBM25WithoutSemanticAndPreservesResultShape$'
          bun test npm/knowns/install.test.js

      - name: Build native Intel binary
        run: go build -ldflags "-s -w -X github.com/howznguyen/knowns/internal/util.Version=${GITHUB_SHA}" -o bin/knowns ./cmd/knowns

      # This job used to assert that the local ONNX path was *disabled* on
      # macOS Intel, the one platform it was never bundled for. That path is
      # gone everywhere now (spec ollama-only-embedding FR-1/FR-2), so Intel
      # is no longer a special case. What is still worth smoking here is the
      # native x86_64 build, the installer's platform detection, and the fact
      # that a machine with no Ollama gets a working keyword-only project —
      # which is exactly AC-13 and AC-7 end to end, on a runner that has no
      # Ollama installed.
      - name: Verify installer and keyword-only project without Ollama
        shell: bash
        run: |
          file bin/knowns | grep -q "Mach-O 64-bit"
          file bin/knowns | grep -q "x86_64"
          # No shared library is shipped alongside the binary any more.
          test ! -e bin/libonnxruntime.dylib
          ./bin/knowns --version

          # Guard the removal itself: `knowns model` must not resolve.
          if ./bin/knowns model list >/dev/null 2>&1; then
            echo "knowns model still resolves; it was removed by D4"
            exit 1
          fi

          export KNOWNS_INSTALLER_TEST=1
          source install/install.sh
          detect_platform
          test "$PLATFORM" = "darwin-x64"

          command -v ollama >/dev/null 2>&1 && {
            echo "this runner unexpectedly has Ollama; the assertions below assume it does not"
            exit 1
          }

          smoke_dir=$(mktemp -d)
          (
            cd "$smoke_dir"
            git init -q
            export KNOWN_LSP_AUTO_INSTALL=0
            export NO_UPDATE_CHECK=1

            init_output=$("$GITHUB_WORKSPACE/bin/knowns" init "Intel Smoke" --no-wizard --no-open 2>&1)
            echo "$init_output"
            # AC-13: no reachable Ollama => semantic search written disabled,
            # and the output tells the user keyword search still works, names
            # the default model and how to get it, and where to read more.
            echo "$init_output" | grep -q "Keyword search still works without it"
            echo "$init_output" | grep -q "ollama pull qwen3-embedding:0.6b"
            echo "$init_output" | grep -q "Read more:"
            test "$(bun -e 'const c=require("fs").readFileSync(".knowns/config.json","utf8");console.log(JSON.stringify(JSON.parse(c).settings.semanticSearch ?? null))')" = "null"

            # AC-3/AC-26/AC-27: a legacy `provider: local` config resolves and
            # migrates without the file being touched until --write.
            bun -e 'const fs = require("fs"); const p = ".knowns/config.json"; const c = JSON.parse(fs.readFileSync(p, "utf8")); c.settings.semanticSearch = { enabled: true, provider: "local", model: "gte-small", huggingFaceId: "Xenova/gte-small", dimensions: 384, maxTokens: 512 }; delete c.schemaVersion; fs.writeFileSync(p, JSON.stringify(c, null, 2) + "\n");'
            before=$(shasum -a 256 .knowns/config.json | cut -d" " -f1)
            "$GITHUB_WORKSPACE/bin/knowns" migrate
            after=$(shasum -a 256 .knowns/config.json | cut -d" " -f1)
            test "$before" = "$after"
            "$GITHUB_WORKSPACE/bin/knowns" migrate --write
            grep -q '"provider": "ollama"' .knowns/config.json
            # AC-29: the rewritten config no longer carries huggingFaceId.
            # `grep -v` would not assert this — it succeeds whenever *any*
            # line fails to match, which is almost always.
            if grep -q "huggingFaceId" .knowns/config.json; then
              echo "huggingFaceId survived migrate --write"
              exit 1
            fi
            second=$("$GITHUB_WORKSPACE/bin/knowns" migrate --write 2>&1)
            echo "$second" | grep -q "Nothing to migrate"

            # AC-7: the configured embedder is unreachable on this runner, so
            # search degrades to keyword results instead of failing.
            export KNOWN_RUNTIME_INLINE=1
            "$GITHUB_WORKSPACE/bin/knowns" task create "Intel keyword fallback" --description "BM25 remains available without an embedder"
            search_output=$("$GITHUB_WORKSPACE/bin/knowns" search "Intel keyword fallback" --plain 2>&1)
            echo "$search_output"
            echo "$search_output" | grep -q "Matched by: keyword"
          )

  lsp-fixtures:
    runs-on: ${{ matrix.os }}
    needs: [test]
    timeout-minutes: 30
    env:
      KNOWNS_LSP_DAEMON: '0'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    name: LSP Fixture Smoke (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            10.0.x
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.14.6'
          terraform_wrapper: false

      - name: Install llvm-mingw toolchain
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -L --retry 5 --retry-delay 5 \
            -o llvm-mingw.zip \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20260407/llvm-mingw-20260407-ucrt-x86_64.zip"
          unzip -q llvm-mingw.zip -d "$RUNNER_TEMP/llvm-mingw"
          TOOLCHAIN_DIR=$(find "$RUNNER_TEMP/llvm-mingw" -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ -z "$TOOLCHAIN_DIR" ]; then
            echo "Failed to extract llvm-mingw toolchain"
            exit 1
          fi
          echo "$TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"
          echo "CC=x86_64-w64-mingw32-clang" >> "$GITHUB_ENV"
          echo "CXX=x86_64-w64-mingw32-clang++" >> "$GITHUB_ENV"
          echo "AR=x86_64-w64-mingw32-ar" >> "$GITHUB_ENV"

      - name: Install C# language server (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          dotnet tool install --global csharp-ls --version 0.25.0
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Install C# language server (Windows)
        if: runner.os == 'Windows'
        run: |
          dotnet tool install --global csharp-ls --version 0.25.0
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build UI
        run: cd ui && bun install --frozen-lockfile && bun run build

      - name: Run doctor portability contract (Unix)
        if: runner.os != 'Windows'
        run: |
          go test -v -count=1 ./internal/doctor
          go test -v -count=1 -run '^TestDoctor' ./internal/cli

      - name: Run doctor portability contract (Windows)
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: '1'
        run: |
          go test -v -count=1 ./internal/doctor
          go test -v -count=1 -run '^TestDoctor' ./internal/cli

      - name: Build Go binary (Unix)
        if: runner.os != 'Windows'
        run: go build -ldflags "-s -w -X github.com/howznguyen/knowns/internal/util.Version=${GITHUB_SHA}" -o bin/knowns ./cmd/knowns

      - name: Build Go binary (Windows)
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: '1'
        run: go build -ldflags "-s -w -X github.com/howznguyen/knowns/internal/util.Version=${env:GITHUB_SHA}" -o bin/knowns.exe ./cmd/knowns

      - name: Install managed LSP fixtures and expose selected binaries
        shell: bash
        run: |
          KNOWNS_BINARY="$PWD/bin/knowns"
          if [ "$RUNNER_OS" = "Windows" ]; then
            KNOWNS_BINARY="$PWD/bin/knowns.exe"
          fi

          for language in markdown bash json terraform yaml; do
            "$KNOWNS_BINARY" lsp install "$language"
          done

          STATUS_FILE="$RUNNER_TEMP/knowns-lsp-status.json"
          "$KNOWNS_BINARY" lsp list --json > "$STATUS_FILE"
          node - "$STATUS_FILE" <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const statusFile = process.argv[2];
          const expected = new Set(['markdown', 'bash', 'json', 'terraform', 'yaml']);
          const rows = JSON.parse(fs.readFileSync(statusFile, 'utf8'));
          const selected = rows.filter((row) => expected.has(row.id));
          const missing = [...expected].filter(
            (id) => !selected.some((row) => row.id === id && row.selected_path),
          );
          if (missing.length > 0) {
            throw new Error(`managed LSP selected_path missing for: ${missing.join(', ')}`);
          }

          const invalidProvenance = selected.filter((row) =>
            row.install_state !== 'installed' ||
            row.requested_version !== 'recommended' ||
            !row.resolved_version ||
            !row.source_location ||
            !row.integrity ||
            !row.installed_at ||
            Number.isNaN(Date.parse(row.installed_at)) ||
            row.verified !== true
          );
          if (invalidProvenance.length > 0) {
            throw new Error(
              `managed LSP provenance incomplete for: ${invalidProvenance.map((row) => row.id).join(', ')}`,
            );
          }

          const directories = [...new Set(selected.map((row) => path.dirname(row.selected_path)))];
          fs.appendFileSync(process.env.GITHUB_PATH, `${directories.join('\n')}\n`);
          NODE

      - name: Run LSP fixtures (Unix)
        if: runner.os != 'Windows'
        run: TEST_LSP_FIXTURES=1 TEST_BINARY="$PWD/bin/knowns" go test -v -timeout 15m -count=1 ./tests/lspfixtures

      - name: Run LSP fixtures (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: TEST_LSP_FIXTURES=1 TEST_BINARY="$PWD/bin/knowns.exe" go test -v -timeout 15m -count=1 ./tests/lspfixtures

  build-and-e2e:
    runs-on: ${{ matrix.os }}
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    name: Build & E2E (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No semantic-model cache: `~/.knowns/models` was the local ONNX model
      # store, removed with that path (spec ollama-only-embedding FR-1/D4).
      # Ollama keeps its own models outside the workspace and CI pulls none.

      - name: Install llvm-mingw toolchain
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -L --retry 5 --retry-delay 5 \
            -o llvm-mingw.zip \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20260407/llvm-mingw-20260407-ucrt-x86_64.zip"
          unzip -q llvm-mingw.zip -d "$RUNNER_TEMP/llvm-mingw"
          TOOLCHAIN_DIR=$(find "$RUNNER_TEMP/llvm-mingw" -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ -z "$TOOLCHAIN_DIR" ]; then
            echo "Failed to extract llvm-mingw toolchain"
            exit 1
          fi
          echo "$TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"
          echo "CC=x86_64-w64-mingw32-clang" >> "$GITHUB_ENV"
          echo "CXX=x86_64-w64-mingw32-clang++" >> "$GITHUB_ENV"
          echo "AR=x86_64-w64-mingw32-ar" >> "$GITHUB_ENV"

      - name: Build UI
        run: cd ui && bun install --frozen-lockfile && bun run build

      - name: Build Go binary (Unix)
        if: runner.os != 'Windows'
        run: make build

      - name: Build Go binary (Windows)
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: '1'
        run: go build -ldflags "-s -w -X github.com/howznguyen/knowns/internal/util.Version=${env:GITHUB_SHA}" -o bin/knowns.exe ./cmd/knowns

      # No ONNX Runtime download here either — see the note in the test job.
      # The E2E binary embeds no C library and needs none at runtime.

      - name: Install Playwright browsers (Unix)
        if: runner.os != 'Windows'
        run: cd ui && bunx playwright install --with-deps chromium

      - name: Install Playwright browsers (Windows)
        if: runner.os == 'Windows'
        run: cd ui && bunx playwright install --with-deps chromium

      - name: Verify binary (Unix)
        if: runner.os != 'Windows'
        run: |
          ./bin/knowns --version
          echo "Build verification passed"

      - name: Verify binary (Windows)
        if: runner.os == 'Windows'
        run: |
          ./bin/knowns.exe --version
          echo "Build verification passed"

      - name: Run E2E tests (Unix)
        if: runner.os != 'Windows'
        run: |
          (cd tests && go test -v -timeout 300s -count=1 -run TestCLI ./...)
          (cd tests && go test -v -timeout 300s -count=1 -run TestMCP ./...)

      - name: Run E2E tests (Windows)
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: '1'
        shell: bash
        run: |
          (cd tests && go test -v -timeout 300s -count=1 -run TestCLI ./...)
          (cd tests && go test -v -timeout 300s -count=1 -run TestMCP ./...)

      - name: Run semantic CLI subset (Unix)
        if: runner.os != 'Windows'
        run: cd tests && TEST_SEMANTIC=1 TEST_BINARY=../bin/knowns go test -v -timeout 300s -count=1 -run TestCLI_SemanticSearch ./...

      - name: Run semantic MCP subset (Unix)
        if: runner.os != 'Windows'
        run: cd tests && TEST_SEMANTIC=1 TEST_BINARY=../bin/knowns go test -v -timeout 300s -count=1 -run 'TestMCP_SemanticSearch/(reindex|keyword_search|hybrid_search|search_docs_only|search_tasks_only)$' ./...

      - name: Run semantic CLI subset (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: cd tests && TEST_SEMANTIC=1 TEST_BINARY=../bin/knowns.exe go test -v -timeout 300s -count=1 -run TestCLI_SemanticSearch ./...

      - name: Run semantic MCP subset (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: cd tests && TEST_SEMANTIC=1 TEST_BINARY=../bin/knowns.exe go test -v -timeout 300s -count=1 -run 'TestMCP_SemanticSearch/(reindex|keyword_search|hybrid_search|search_docs_only|search_tasks_only)$' ./...

      - name: Run UI Playwright tests (Unix)
        if: runner.os != 'Windows'
        run: cd ui && TEST_BINARY=../bin/knowns bun test:e2e

      - name: Run UI Playwright tests (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cd ui && TEST_BINARY=../bin/knowns.exe bun test:e2e
