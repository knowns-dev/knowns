name: CI

# The Go implementation was removed after 0.35.0 (KN-NDD5YY). Every job here drives the compiled
# TypeScript binary; the unit and differential suites run in ts-cli.yml.

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            bin: cli/dist/linux-x64/knowns
          - os: windows-latest
            target: bun-windows-x64
            bin: cli/dist/windows-x64/knowns.exe
    name: Lint & Test (${{ matrix.os }})
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build UI
        run: cd ui && bun install --frozen-lockfile && bun run build

      - name: Run npm installer tests
        if: runner.os == 'Windows'
        run: bun test npm/knowns/install.test.js

      - name: Install TS CLI dependencies
        working-directory: cli
        run: bun install --frozen-lockfile

      # Catches a reference page describing a command the binary does not have,
      # and a command with no page at all. Linux only: the output is identical
      # across platforms, so running it twice buys nothing.
      - name: Check CLI reference matches the command tree
        if: runner.os == 'Linux'
        working-directory: cli
        run: bun scripts/gen-cli-docs.ts --check

      # Catches a README or embedded skill telling a reader (or an agent) to run
      # a command or flag the binary does not have.
      - name: Check docs only use commands that exist
        if: runner.os == 'Linux'
        working-directory: cli
        run: bun scripts/gen-cli-docs.ts --lint

      - name: Build TS binary
        working-directory: cli
        env:
          KNOWNS_VERSION: 0.0.0-ci
        run: bun scripts/gen-ui-assets.ts && bun run build ${{ matrix.target }}

      - name: Verify binary
        run: ${{ matrix.bin }} --version

      - name: Run canonical keyword retrieval evaluation gate
        if: runner.os != 'Windows'
        run: ${{ matrix.bin }} --json eval retrieval --output "$RUNNER_TEMP/retrieval-evaluation-keyword.json"

      - name: Upload canonical keyword retrieval report
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-evaluation-keyword
          path: ${{ runner.temp }}/retrieval-evaluation-keyword.json
          if-no-files-found: error

  macos-intel:
    runs-on: macos-15-intel
    needs: [test]
    timeout-minutes: 20
    name: macOS Intel CLI Smoke
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Build UI
        run: cd ui && bun install --frozen-lockfile && bun run build

      - name: Run installer tests
        run: bun test npm/knowns/install.test.js

      - name: Build native Intel binary
        working-directory: cli
        env:
          KNOWNS_VERSION: 0.0.0-ci
        run: |
          bun install --frozen-lockfile
          bun scripts/gen-ui-assets.ts
          bun run build bun-darwin-x64
          mkdir -p ../bin
          cp dist/darwin-x64/knowns ../bin/knowns

      # What is worth smoking here is the native x86_64 build, the installer's
      # platform detection, and the fact that a machine with no Ollama gets a
      # working keyword-only project, on a runner that has no Ollama installed.
      - name: Verify installer and keyword-only project without Ollama
        shell: bash
        run: |
          file bin/knowns | grep -q "Mach-O 64-bit"
          file bin/knowns | grep -q "x86_64"
          ./bin/knowns --version

          # Guard the removal itself: `knowns model` must not resolve.
          if ./bin/knowns model list >/dev/null 2>&1; then
            echo "knowns model still resolves; it was removed by D4"
            exit 1
          fi

          export KNOWNS_INSTALLER_TEST=1
          source install/install.sh
          detect_platform
          test "$PLATFORM" = "darwin-x64"

          command -v ollama >/dev/null 2>&1 && {
            echo "this runner unexpectedly has Ollama; the assertions below assume it does not"
            exit 1
          }

          smoke_dir=$(mktemp -d)
          (
            cd "$smoke_dir"
            git init -q
            export KNOWN_LSP_AUTO_INSTALL=0
            export NO_UPDATE_CHECK=1

            init_output=$("$GITHUB_WORKSPACE/bin/knowns" init "Intel Smoke" --no-wizard --no-open 2>&1)
            echo "$init_output"
            # No reachable Ollama => semantic search written disabled, and the
            # output tells the user keyword search still works, names the
            # default model and how to get it, and where to read more.
            echo "$init_output" | grep -q "Keyword search still works without it"
            echo "$init_output" | grep -q "ollama pull qwen3-embedding:0.6b"
            echo "$init_output" | grep -q "Read more:"
            test "$(bun -e 'const c=require("fs").readFileSync(".knowns/config.json","utf8");console.log(JSON.stringify(JSON.parse(c).settings.semanticSearch ?? null))')" = "null"

            # A legacy `provider: local` config resolves and migrates without
            # the file being touched until --write.
            bun -e 'const fs = require("fs"); const p = ".knowns/config.json"; const c = JSON.parse(fs.readFileSync(p, "utf8")); c.settings.semanticSearch = { enabled: true, provider: "local", model: "gte-small", huggingFaceId: "Xenova/gte-small", dimensions: 384, maxTokens: 512 }; delete c.schemaVersion; fs.writeFileSync(p, JSON.stringify(c, null, 2) + "\n");'
            before=$(shasum -a 256 .knowns/config.json | cut -d" " -f1)
            "$GITHUB_WORKSPACE/bin/knowns" migrate
            after=$(shasum -a 256 .knowns/config.json | cut -d" " -f1)
            test "$before" = "$after"
            "$GITHUB_WORKSPACE/bin/knowns" migrate --write
            grep -q '"provider": "ollama"' .knowns/config.json
            # `grep -v` would not assert this: it succeeds whenever *any*
            # line fails to match, which is almost always.
            if grep -q "huggingFaceId" .knowns/config.json; then
              echo "huggingFaceId survived migrate --write"
              exit 1
            fi
            second=$("$GITHUB_WORKSPACE/bin/knowns" migrate --write 2>&1)
            echo "$second" | grep -q "Nothing to migrate"

            # The configured embedder is unreachable on this runner, so search
            # degrades to keyword results instead of failing.
            export KNOWN_RUNTIME_INLINE=1
            "$GITHUB_WORKSPACE/bin/knowns" task create "Intel keyword fallback" --description "BM25 remains available without an embedder"
            search_output=$("$GITHUB_WORKSPACE/bin/knowns" search "Intel keyword fallback" --plain 2>&1)
            echo "$search_output"
            echo "$search_output" | grep -q "Matched by: keyword"
          )

  lsp-fixtures:
    runs-on: ${{ matrix.os }}
    needs: [test]
    timeout-minutes: 30
    env:
      KNOWNS_LSP_DAEMON: '0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            bin: dist/linux-x64/knowns
          - os: macos-latest
            target: bun-darwin-arm64
            bin: dist/darwin-arm64/knowns
          - os: windows-latest
            target: bun-windows-x64
            bin: dist/windows-x64/knowns.exe
    name: LSP Fixture Smoke (${{ matrix.os }})
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            10.0.x
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.14.6'
          terraform_wrapper: false

      - name: Install C# language server (Unix)
        if: runner.os != 'Windows'
        run: |
          dotnet tool install --global csharp-ls --version 0.25.0
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Install C# language server (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global csharp-ls --version 0.25.0
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build UI
        run: cd ui && bun install --frozen-lockfile && bun run build

      - name: Build TS binary
        working-directory: cli
        env:
          KNOWNS_VERSION: 0.0.0-ci
        run: |
          bun install --frozen-lockfile
          bun scripts/gen-ui-assets.ts
          bun run build ${{ matrix.target }}
          echo "KNOWNS_TS_BIN=$PWD/${{ matrix.bin }}" >> "$GITHUB_ENV"

      - name: Install managed LSP fixtures and expose selected binaries
        run: |
          for language in markdown bash json terraform yaml; do
            "$KNOWNS_TS_BIN" lsp install "$language"
          done

          STATUS_FILE="$RUNNER_TEMP/knowns-lsp-status.json"
          "$KNOWNS_TS_BIN" lsp list --json > "$STATUS_FILE"
          node - "$STATUS_FILE" <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const statusFile = process.argv[2];
          const expected = new Set(['markdown', 'bash', 'json', 'terraform', 'yaml']);
          const rows = JSON.parse(fs.readFileSync(statusFile, 'utf8'));
          const selected = rows.filter((row) => expected.has(row.id));
          const missing = [...expected].filter(
            (id) => !selected.some((row) => row.id === id && row.selected_path),
          );
          if (missing.length > 0) {
            throw new Error(`managed LSP selected_path missing for: ${missing.join(', ')}`);
          }

          const invalidProvenance = selected.filter((row) =>
            row.install_state !== 'installed' ||
            row.requested_version !== 'recommended' ||
            !row.resolved_version ||
            !row.source_location ||
            !row.integrity ||
            !row.installed_at ||
            Number.isNaN(Date.parse(row.installed_at)) ||
            row.verified !== true
          );
          if (invalidProvenance.length > 0) {
            throw new Error(
              `managed LSP provenance incomplete for: ${invalidProvenance.map((row) => row.id).join(', ')}`,
            );
          }

          const directories = [...new Set(selected.map((row) => path.dirname(row.selected_path)))];
          fs.appendFileSync(process.env.GITHUB_PATH, `${directories.join('\n')}\n`);
          NODE

      # CI=1 is set by Actions, so a missing language server fails instead of skipping.
      - name: Run LSP fixtures
        working-directory: cli
        run: TEST_LSP_FIXTURES=1 bun test test/e2e/lspfixtures --timeout 900000

  build-and-e2e:
    # ubuntu-latest moved to 26.04, which Playwright 1.58 cannot install browsers for.
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'ubuntu-24.04' || matrix.os }}
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            bin: dist/linux-x64/knowns
          - os: windows-latest
            target: bun-windows-x64
            bin: dist/windows-x64/knowns.exe
    name: Build & E2E (${{ matrix.os }})
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build UI
        run: cd ui && bun install --frozen-lockfile && bun run build

      - name: Build TS binary
        working-directory: cli
        env:
          KNOWNS_VERSION: 0.0.0-ci
        run: |
          bun install --frozen-lockfile
          bun scripts/gen-ui-assets.ts
          bun run build ${{ matrix.target }}
          ${{ matrix.bin }} --version
          echo "KNOWNS_TS_BIN=$PWD/${{ matrix.bin }}" >> "$GITHUB_ENV"

      - name: Install Playwright browsers
        run: cd ui && bunx playwright install --with-deps chromium

      # The CLI and MCP end-to-end suites (ported from the Go tests/ suite) against the compiled
      # binary, including the TEST_SEMANTIC subsets, which need no reachable embedder.
      # lspfixtures/ skips here without TEST_LSP_FIXTURES; the lsp-fixtures job runs it.
      - name: Run E2E tests
        working-directory: cli
        run: TEST_SEMANTIC=1 bun test test/e2e --timeout 300000

      - name: Run UI Playwright tests
        run: cd ui && TEST_BINARY="$KNOWNS_TS_BIN" bun test:e2e
