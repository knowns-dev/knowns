name: CI

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      update_retrieval_baseline:
        description: 'Regenerate the pinned retrieval baselines instead of gating on them'
        type: boolean
        default: false
      baseline_reason:
        description: 'Review reason recorded in the regenerated baselines (required when regenerating)'
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    name: Lint & Test (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install llvm-mingw toolchain
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -L --retry 5 --retry-delay 5 \
            -o llvm-mingw.zip \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20260407/llvm-mingw-20260407-ucrt-x86_64.zip"
          unzip -q llvm-mingw.zip -d "$RUNNER_TEMP/llvm-mingw"
          TOOLCHAIN_DIR=$(find "$RUNNER_TEMP/llvm-mingw" -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ -z "$TOOLCHAIN_DIR" ]; then
            echo "Failed to extract llvm-mingw toolchain"
            exit 1
          fi
          echo "$TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"
          echo "CC=x86_64-w64-mingw32-clang" >> "$GITHUB_ENV"
          echo "CXX=x86_64-w64-mingw32-clang++" >> "$GITHUB_ENV"
          echo "AR=x86_64-w64-mingw32-ar" >> "$GITHUB_ENV"

      - name: Build UI
        run: cd ui && bun install --frozen-lockfile && bun run build

      - name: Run npm installer tests
        if: runner.os == 'Windows'
        run: bun test npm/knowns/install.test.js

      - name: Build Go binary (Unix)
        if: runner.os != 'Windows'
        run: make build

      - name: Build Go binary (Windows)
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: '1'
        run: go build -ldflags "-s -w -X github.com/howznguyen/knowns/internal/util.Version=${env:GITHUB_SHA}" -o bin/knowns.exe ./cmd/knowns

      - name: Download ONNX Runtime (Unix)
        if: runner.os != 'Windows'
        env:
          ORT_VERSION: "1.25.0"
        run: |
          BASE_URL="https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}"
          ARCHIVE="onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          curl -L --retry 5 --retry-delay 5 -o "/tmp/${ARCHIVE}" "${BASE_URL}/${ARCHIVE}"
          tar -xzf "/tmp/${ARCHIVE}" -C /tmp
          mkdir -p ./bin
          cp "/tmp/onnxruntime-linux-x64-${ORT_VERSION}/lib/libonnxruntime.so.${ORT_VERSION}" ./bin/libonnxruntime.so
          echo "KNOWNS_ORT_LIB=$(pwd)/bin/libonnxruntime.so" >> "$GITHUB_ENV"

      - name: Download ONNX Runtime (Windows)
        if: runner.os == 'Windows'
        env:
          ORT_VERSION: "1.25.0"
        shell: bash
        run: |
          BASE_URL="https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}"
          ARCHIVE="onnxruntime-win-x64-${ORT_VERSION}.zip"
          curl -L --retry 5 --retry-delay 5 -o "/tmp/${ARCHIVE}" "${BASE_URL}/${ARCHIVE}"
          unzip -q "/tmp/${ARCHIVE}" -d /tmp
          mkdir -p ./bin
          cp "/tmp/onnxruntime-win-x64-${ORT_VERSION}/lib/onnxruntime.dll" ./bin/onnxruntime.dll
          echo "KNOWNS_ORT_LIB=$(pwd)/bin/onnxruntime.dll" >> "$GITHUB_ENV"

      - name: Go vet (Unix)
        if: runner.os != 'Windows'
        run: go vet ./...

      - name: Go vet (Windows)
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: '1'
        run: go vet ./...

      - name: Run tests (Unix)
        if: runner.os != 'Windows'
        run: go test -v -race -count=1 ./...

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: '1'
        run: go test -v -race -count=1 ./...

      - name: Run canonical keyword retrieval evaluation gate
        if: runner.os != 'Windows'
        run: ./bin/knowns --json eval retrieval --output "$RUNNER_TEMP/retrieval-evaluation-keyword.json"

      - name: Upload canonical keyword retrieval report
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-evaluation-keyword
          path: ${{ runner.temp }}/retrieval-evaluation-keyword.json
          if-no-files-found: error

  macos-intel:
    runs-on: macos-15-intel
    needs: [test]
    timeout-minutes: 20
    name: macOS Intel CLI Smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: oven-sh/setup-bun@v2

      - name: Build UI
        run: cd ui && bun install --frozen-lockfile && bun run build

      - name: Run platform and keyword fallback tests
        run: |
          # Existing local-provider unit tests use mocked embedders and assume
          # a supported runtime. Model that explicit Intel opt-in here; the
          # commands below run without the override and verify the disabled path.
          KNOWNS_ORT_LIB="${RUNNER_TEMP}/libonnxruntime-test.dylib" \
            go test ./internal/search ./internal/cli ./internal/server/routes ./internal/doctor
          go test ./internal/search -run '^TestKeywordModeUsesBM25WithoutSemanticAndPreservesResultShape$'
          bun test npm/knowns/install.test.js

      - name: Build native Intel binary without ONNX Runtime
        env:
          CGO_ENABLED: '1'
        run: go build -ldflags "-s -w -X github.com/howznguyen/knowns/internal/util.Version=${GITHUB_SHA}" -o bin/knowns ./cmd/knowns

      - name: Verify installer and disabled Local ONNX path
        shell: bash
        run: |
          file bin/knowns | grep -q "Mach-O 64-bit"
          file bin/knowns | grep -q "x86_64"
          test ! -e bin/libonnxruntime.dylib
          ./bin/knowns --version

          export KNOWNS_INSTALLER_TEST=1
          source install/install.sh
          detect_platform
          test "$PLATFORM" = "darwin-x64"

          output=$(./bin/knowns model download gte-small 2>&1) && {
            echo "Local ONNX model download unexpectedly succeeded"
            exit 1
          }
          echo "$output" | grep -q "Local ONNX is not bundled for macOS Intel"

          smoke_dir=$(mktemp -d)
          (
            cd "$smoke_dir"
            git init -q
            export KNOWN_LSP_AUTO_INSTALL=0
            export NO_UPDATE_CHECK=1
            "$GITHUB_WORKSPACE/bin/knowns" init "Intel Smoke" --no-wizard --no-open
            config_output=$("$GITHUB_WORKSPACE/bin/knowns" config set semanticSearch true 2>&1) && {
              echo "Local ONNX config unexpectedly succeeded"
              exit 1
            }
            echo "$config_output" | grep -q "Local ONNX is not bundled for macOS Intel"
            sync_output=$("$GITHUB_WORKSPACE/bin/knowns" sync --model 2>&1)
            echo "$sync_output"
            echo "$sync_output" | grep -q "keyword/BM25 search remains active"

            bun -e 'const fs = require("fs"); const p = ".knowns/config.json"; const c = JSON.parse(fs.readFileSync(p, "utf8")); c.settings.semanticSearch = { enabled: true, provider: "local", model: "gte-small", huggingFaceId: "Xenova/gte-small", dimensions: 384, maxTokens: 512 }; fs.writeFileSync(p, JSON.stringify(c, null, 2) + "\n");'
            export KNOWN_RUNTIME_INLINE=1
            status_output=$("$GITHUB_WORKSPACE/bin/knowns" search --status-check 2>&1)
            echo "$status_output" | grep -q "ONNX runtime: unavailable on macOS Intel"
            setup_output=$("$GITHUB_WORKSPACE/bin/knowns" search --setup 2>&1)
            echo "$setup_output" | grep -q "Local ONNX setup is unavailable on macOS Intel"
            "$GITHUB_WORKSPACE/bin/knowns" task create "Intel keyword fallback" --description "BM25 remains available without ONNX"
            search_output=$("$GITHUB_WORKSPACE/bin/knowns" search "Intel keyword fallback" --plain 2>&1)
            echo "$search_output"
            echo "$search_output" | grep -q "Matched by: keyword"
          )

  retrieval-semantic-evaluation:
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 45
    env:
      KNOWNS_RUNTIME_INLINE: '1'
      PINNED_RETRIEVAL_RUNTIME: local/gte-small@384
      ORT_VERSION: '1.25.0'
    name: Retrieval Evaluation (Pinned Semantic Runtime)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: oven-sh/setup-bun@v2

      - name: Build UI
        run: cd ui && bun install --frozen-lockfile && bun run build

      - name: Build Knowns
        run: go build -ldflags "-s -w -X github.com/howznguyen/knowns/internal/util.Version=${GITHUB_SHA}" -o bin/knowns ./cmd/knowns

      - name: Install pinned ONNX Runtime
        run: |
          BASE_URL="https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}"
          ARCHIVE="onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          curl -L --retry 5 --retry-delay 5 -o "/tmp/${ARCHIVE}" "${BASE_URL}/${ARCHIVE}"
          tar -xzf "/tmp/${ARCHIVE}" -C /tmp
          cp "/tmp/onnxruntime-linux-x64-${ORT_VERSION}/lib/libonnxruntime.so.${ORT_VERSION}" ./bin/libonnxruntime.so
          echo "KNOWNS_ORT_LIB=$(pwd)/bin/libonnxruntime.so" >> "$GITHUB_ENV"

      - name: Prepare pinned semantic index
        run: |
          ./bin/knowns model download gte-small
          ./bin/knowns model set gte-small
          ./bin/knowns config set settings.semanticSearch.provider local
          ./bin/knowns search --reindex --plain

      - name: Run pinned semantic retrieval evaluation
        if: ${{ !inputs.update_retrieval_baseline }}
        run: |
          ./bin/knowns --json eval retrieval \
            --mode semantic \
            --runtime-id "$PINNED_RETRIEVAL_RUNTIME" \
            --baseline internal/search/testdata/retrieval_evaluation_semantic_baseline.json \
            --output "$RUNNER_TEMP/retrieval-evaluation-semantic.json"

      - name: Run pinned hybrid retrieval evaluation
        if: ${{ !inputs.update_retrieval_baseline }}
        run: |
          ./bin/knowns --json eval retrieval \
            --mode hybrid \
            --runtime-id "$PINNED_RETRIEVAL_RUNTIME" \
            --baseline internal/search/testdata/retrieval_evaluation_hybrid_baseline.json \
            --output "$RUNNER_TEMP/retrieval-evaluation-hybrid.json"

      # Manual maintenance path. Baselines are runtime-sensitive, so they have to
      # be regenerated in this job's pinned environment (linux x64 + the pinned
      # ONNX build) rather than on a contributor's machine.
      - name: Regenerate pinned retrieval baselines
        if: ${{ inputs.update_retrieval_baseline }}
        env:
          BASELINE_REASON: ${{ inputs.baseline_reason }}
        run: |
          if [ -z "$BASELINE_REASON" ]; then
            echo "baseline_reason is required when update_retrieval_baseline is set" >&2
            exit 1
          fi
          ./bin/knowns --json eval retrieval \
            --mode semantic \
            --runtime-id "$PINNED_RETRIEVAL_RUNTIME" \
            --baseline internal/search/testdata/retrieval_evaluation_semantic_baseline.json \
            --update-baseline \
            --reason "$BASELINE_REASON" \
            --output "$RUNNER_TEMP/retrieval-evaluation-semantic.json"
          ./bin/knowns --json eval retrieval \
            --mode hybrid \
            --runtime-id "$PINNED_RETRIEVAL_RUNTIME" \
            --baseline internal/search/testdata/retrieval_evaluation_hybrid_baseline.json \
            --update-baseline \
            --reason "$BASELINE_REASON" \
            --output "$RUNNER_TEMP/retrieval-evaluation-hybrid.json"

      - name: Upload regenerated retrieval baselines
        if: ${{ inputs.update_retrieval_baseline }}
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-evaluation-baselines
          path: |
            internal/search/testdata/retrieval_evaluation_semantic_baseline.json
            internal/search/testdata/retrieval_evaluation_hybrid_baseline.json
          if-no-files-found: error

      - name: Upload canonical semantic and hybrid reports
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-evaluation-semantic-hybrid
          path: |
            ${{ runner.temp }}/retrieval-evaluation-semantic.json
            ${{ runner.temp }}/retrieval-evaluation-hybrid.json
          if-no-files-found: error

  lsp-fixtures:
    runs-on: ${{ matrix.os }}
    needs: [test]
    timeout-minutes: 30
    env:
      KNOWNS_LSP_DAEMON: '0'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    name: LSP Fixture Smoke (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            10.0.x
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.14.6'
          terraform_wrapper: false

      - name: Install llvm-mingw toolchain
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -L --retry 5 --retry-delay 5 \
            -o llvm-mingw.zip \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20260407/llvm-mingw-20260407-ucrt-x86_64.zip"
          unzip -q llvm-mingw.zip -d "$RUNNER_TEMP/llvm-mingw"
          TOOLCHAIN_DIR=$(find "$RUNNER_TEMP/llvm-mingw" -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ -z "$TOOLCHAIN_DIR" ]; then
            echo "Failed to extract llvm-mingw toolchain"
            exit 1
          fi
          echo "$TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"
          echo "CC=x86_64-w64-mingw32-clang" >> "$GITHUB_ENV"
          echo "CXX=x86_64-w64-mingw32-clang++" >> "$GITHUB_ENV"
          echo "AR=x86_64-w64-mingw32-ar" >> "$GITHUB_ENV"

      - name: Install C# language server (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          dotnet tool install --global csharp-ls --version 0.25.0
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Install C# language server (Windows)
        if: runner.os == 'Windows'
        run: |
          dotnet tool install --global csharp-ls --version 0.25.0
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build UI
        run: cd ui && bun install --frozen-lockfile && bun run build

      - name: Run doctor portability contract (Unix)
        if: runner.os != 'Windows'
        run: |
          go test -v -count=1 ./internal/doctor
          go test -v -count=1 -run '^TestDoctor' ./internal/cli

      - name: Run doctor portability contract (Windows)
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: '1'
        run: |
          go test -v -count=1 ./internal/doctor
          go test -v -count=1 -run '^TestDoctor' ./internal/cli

      - name: Build Go binary (Unix)
        if: runner.os != 'Windows'
        run: go build -ldflags "-s -w -X github.com/howznguyen/knowns/internal/util.Version=${GITHUB_SHA}" -o bin/knowns ./cmd/knowns

      - name: Build Go binary (Windows)
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: '1'
        run: go build -ldflags "-s -w -X github.com/howznguyen/knowns/internal/util.Version=${env:GITHUB_SHA}" -o bin/knowns.exe ./cmd/knowns

      - name: Install managed LSP fixtures and expose selected binaries
        shell: bash
        run: |
          KNOWNS_BINARY="$PWD/bin/knowns"
          if [ "$RUNNER_OS" = "Windows" ]; then
            KNOWNS_BINARY="$PWD/bin/knowns.exe"
          fi

          for language in markdown bash json terraform yaml; do
            "$KNOWNS_BINARY" lsp install "$language"
          done

          STATUS_FILE="$RUNNER_TEMP/knowns-lsp-status.json"
          "$KNOWNS_BINARY" lsp list --json > "$STATUS_FILE"
          node - "$STATUS_FILE" <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const statusFile = process.argv[2];
          const expected = new Set(['markdown', 'bash', 'json', 'terraform', 'yaml']);
          const rows = JSON.parse(fs.readFileSync(statusFile, 'utf8'));
          const selected = rows.filter((row) => expected.has(row.id));
          const missing = [...expected].filter(
            (id) => !selected.some((row) => row.id === id && row.selected_path),
          );
          if (missing.length > 0) {
            throw new Error(`managed LSP selected_path missing for: ${missing.join(', ')}`);
          }

          const invalidProvenance = selected.filter((row) =>
            row.install_state !== 'installed' ||
            row.requested_version !== 'recommended' ||
            !row.resolved_version ||
            !row.source_location ||
            !row.integrity ||
            !row.installed_at ||
            Number.isNaN(Date.parse(row.installed_at)) ||
            row.verified !== true
          );
          if (invalidProvenance.length > 0) {
            throw new Error(
              `managed LSP provenance incomplete for: ${invalidProvenance.map((row) => row.id).join(', ')}`,
            );
          }

          const directories = [...new Set(selected.map((row) => path.dirname(row.selected_path)))];
          fs.appendFileSync(process.env.GITHUB_PATH, `${directories.join('\n')}\n`);
          NODE

      - name: Run LSP fixtures (Unix)
        if: runner.os != 'Windows'
        run: TEST_LSP_FIXTURES=1 TEST_BINARY="$PWD/bin/knowns" go test -v -timeout 15m -count=1 ./tests/lspfixtures

      - name: Run LSP fixtures (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: TEST_LSP_FIXTURES=1 TEST_BINARY="$PWD/bin/knowns.exe" go test -v -timeout 15m -count=1 ./tests/lspfixtures

  build-and-e2e:
    runs-on: ${{ matrix.os }}
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    name: Build & E2E (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache semantic models
        uses: actions/cache@v4
        with:
          path: ~/.knowns/models
          key: semantic-models-${{ runner.os }}-all-MiniLM-L6-v2-v1

      - name: Install llvm-mingw toolchain
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -L --retry 5 --retry-delay 5 \
            -o llvm-mingw.zip \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20260407/llvm-mingw-20260407-ucrt-x86_64.zip"
          unzip -q llvm-mingw.zip -d "$RUNNER_TEMP/llvm-mingw"
          TOOLCHAIN_DIR=$(find "$RUNNER_TEMP/llvm-mingw" -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ -z "$TOOLCHAIN_DIR" ]; then
            echo "Failed to extract llvm-mingw toolchain"
            exit 1
          fi
          echo "$TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"
          echo "CC=x86_64-w64-mingw32-clang" >> "$GITHUB_ENV"
          echo "CXX=x86_64-w64-mingw32-clang++" >> "$GITHUB_ENV"
          echo "AR=x86_64-w64-mingw32-ar" >> "$GITHUB_ENV"

      - name: Build UI
        run: cd ui && bun install --frozen-lockfile && bun run build

      - name: Build Go binary (Unix)
        if: runner.os != 'Windows'
        run: make build

      - name: Build Go binary (Windows)
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: '1'
        run: go build -ldflags "-s -w -X github.com/howznguyen/knowns/internal/util.Version=${env:GITHUB_SHA}" -o bin/knowns.exe ./cmd/knowns

      - name: Download ONNX Runtime (Unix)
        if: runner.os != 'Windows'
        env:
          ORT_VERSION: "1.25.0"
        run: |
          BASE_URL="https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}"
          ARCHIVE="onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          curl -L --retry 5 --retry-delay 5 -o "/tmp/${ARCHIVE}" "${BASE_URL}/${ARCHIVE}"
          tar -xzf "/tmp/${ARCHIVE}" -C /tmp
          mkdir -p ./bin
          cp "/tmp/onnxruntime-linux-x64-${ORT_VERSION}/lib/libonnxruntime.so.${ORT_VERSION}" ./bin/libonnxruntime.so
          echo "KNOWNS_ORT_LIB=$(pwd)/bin/libonnxruntime.so" >> "$GITHUB_ENV"

      - name: Download ONNX Runtime (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          BASE_URL="https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}"
          ARCHIVE="onnxruntime-win-x64-${ORT_VERSION}.zip"
          curl -L --retry 5 --retry-delay 5 -o "/tmp/${ARCHIVE}" "${BASE_URL}/${ARCHIVE}"
          unzip -q "/tmp/${ARCHIVE}" -d /tmp
          mkdir -p ./bin
          cp "/tmp/onnxruntime-win-x64-${ORT_VERSION}/lib/onnxruntime.dll" ./bin/onnxruntime.dll
          echo "KNOWNS_ORT_LIB=$(pwd)/bin/onnxruntime.dll" >> "$GITHUB_ENV"
        env:
          ORT_VERSION: "1.25.0"

      - name: Install Playwright browsers (Unix)
        if: runner.os != 'Windows'
        run: cd ui && bunx playwright install --with-deps chromium

      - name: Install Playwright browsers (Windows)
        if: runner.os == 'Windows'
        run: cd ui && bunx playwright install --with-deps chromium

      - name: Verify binary (Unix)
        if: runner.os != 'Windows'
        run: |
          ./bin/knowns --version
          echo "Build verification passed"

      - name: Verify binary (Windows)
        if: runner.os == 'Windows'
        run: |
          ./bin/knowns.exe --version
          echo "Build verification passed"

      - name: Run E2E tests (Unix)
        if: runner.os != 'Windows'
        run: |
          (cd tests && go test -v -timeout 300s -count=1 -run TestCLI ./...)
          (cd tests && go test -v -timeout 300s -count=1 -run TestMCP ./...)

      - name: Run E2E tests (Windows)
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: '1'
        shell: bash
        run: |
          (cd tests && go test -v -timeout 300s -count=1 -run TestCLI ./...)
          (cd tests && go test -v -timeout 300s -count=1 -run TestMCP ./...)

      - name: Run semantic CLI subset (Unix)
        if: runner.os != 'Windows'
        run: cd tests && TEST_SEMANTIC=1 TEST_BINARY=../bin/knowns go test -v -timeout 300s -count=1 -run TestCLI_SemanticSearch ./...

      - name: Run semantic MCP subset (Unix)
        if: runner.os != 'Windows'
        run: cd tests && TEST_SEMANTIC=1 TEST_BINARY=../bin/knowns go test -v -timeout 300s -count=1 -run 'TestMCP_SemanticSearch/(reindex|keyword_search|hybrid_search|search_docs_only|search_tasks_only)$' ./...

      - name: Run semantic CLI subset (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: cd tests && TEST_SEMANTIC=1 TEST_BINARY=../bin/knowns.exe go test -v -timeout 300s -count=1 -run TestCLI_SemanticSearch ./...

      - name: Run semantic MCP subset (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: cd tests && TEST_SEMANTIC=1 TEST_BINARY=../bin/knowns.exe go test -v -timeout 300s -count=1 -run 'TestMCP_SemanticSearch/(reindex|keyword_search|hybrid_search|search_docs_only|search_tasks_only)$' ./...

      - name: Run UI Playwright tests (Unix)
        if: runner.os != 'Windows'
        run: cd ui && TEST_BINARY=../bin/knowns bun test:e2e

      - name: Run UI Playwright tests (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cd ui && TEST_BINARY=../bin/knowns.exe bun test:e2e
