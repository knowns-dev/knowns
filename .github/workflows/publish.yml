name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 0.35.0)"
        required: false
        type: string

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Determine version
        id: meta
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            echo "Unable to determine release version"
            exit 1
          fi

          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Trace release metadata
        run: |
          echo "meta.version=${{ steps.meta.outputs.version }}"
          echo "meta.tag=${{ steps.meta.outputs.tag }}"

  verify:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build UI
        env:
          APP_VERSION: ${{ needs.meta.outputs.version }}
        run: cd ui && bun install --frozen-lockfile && bun run build

      - name: Trace built UI version
        env:
          EXPECTED_VERSION: ${{ needs.meta.outputs.version }}
          APP_VERSION: ${{ needs.meta.outputs.version }}
        run: |
          UI_PACKAGE_VERSION=$(node -p 'require("./ui/package.json").version')

          echo "expected_version=$EXPECTED_VERSION"
          echo "app_version_env=$APP_VERSION"
          echo "ui_package_version=$UI_PACKAGE_VERSION"

          echo "dist files:"
          ls -la ui/dist
          ls -la ui/dist/assets || true

          echo "version-like strings in dist:"
          grep -RhoE '[0-9]+\.[0-9]+\.[0-9]+' ui/dist | sort -u || true

          echo "search expected version in dist:"
          if grep -R "$EXPECTED_VERSION" ui/dist >/dev/null 2>&1; then
            echo "OK: found expected version $EXPECTED_VERSION in built UI"
          else
            echo "ERROR: expected version $EXPECTED_VERSION not found in built UI"
            exit 1
          fi

      # The Go suite stays in the release gate until the switch merge: it is the parity oracle
      # for the TypeScript CLI (spec D3). The shipped binary is the TypeScript one below.
      - name: Run Go tests
        run: go test -v -race ./...

      - name: Run Go vet
        run: go vet ./...

      - name: TS CLI check and unit tests
        working-directory: cli
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run test

      - name: Upload UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist/
          retention-days: 1

  # One Bun job cross-compiles all six targets. It runs on macOS so the darwin binaries get the
  # ad-hoc re-sign in cli/scripts/lib.ts; the version is injected with --define from the tag.
  build-binaries:
    needs: [meta, verify]
    runs-on: macos-15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Download UI artifact
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist/

      - name: Build TypeScript binaries (6 targets)
        working-directory: cli
        env:
          KNOWNS_VERSION: ${{ needs.meta.outputs.version }}
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Package npm packages and release assets
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: bun scripts/package-release.ts --version "$VERSION" --dist cli/dist --out release

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/
          retention-days: 1

  # Every asset runs `--version` on its own OS/arch before anything is published.
  smoke:
    needs: [meta, build-binaries]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, platform: darwin-arm64, exe: knowns }
          - { runner: macos-15-intel, platform: darwin-x64, exe: knowns }
          - { runner: ubuntu-latest, platform: linux-x64, exe: knowns }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64, exe: knowns }
          - { runner: windows-latest, platform: win-x64, exe: knowns.exe }
          - { runner: windows-11-arm, platform: win-arm64, exe: knowns.exe }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: release
          path: release/

      - name: Binary reports the release version
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          dir=$(mktemp -d)
          tar -xzf "release/assets/knowns-${{ matrix.platform }}.tar.gz" -C "$dir"
          chmod +x "$dir/${{ matrix.exe }}" || true
          got=$(NO_UPDATE_CHECK=1 "$dir/${{ matrix.exe }}" --version | tr -d '\r')
          echo "$got"
          [ "$got" = "knowns version ${VERSION}" ] || { echo "FATAL: expected knowns version ${VERSION}"; exit 1; }

      - name: Run npm installer tests
        if: runner.os == 'Windows' || matrix.platform == 'darwin-x64'
        run: bun test npm/knowns/install.test.js

  publish:
    needs: [meta, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: release
          path: release/

      - name: Prepare npm packages
        run: |
          cp README.md release/npm/knowns/README.md
          for pkg in release/npm/knowns-*; do
            for exe in "$pkg/knowns" "$pkg/knowns.exe"; do
              [ -f "$exe" ] && chmod +x "$exe" || true
            done
          done

      - name: Verify package contents and binary architectures
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -e
          for p in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win-arm64 win-x64; do
            pkg="release/npm/knowns-$p"
            v=$(node -p "require('./$pkg/package.json').version")
            [ "$v" = "$VERSION" ] || { echo "FATAL: $pkg is $v, expected $VERSION"; exit 1; }
            case "$p" in win-*) exe=knowns.exe ;; *) exe=knowns ;; esac
            [ -f "$pkg/$exe" ] || { echo "FATAL: $pkg/$exe is missing"; exit 1; }
            tar -tzf "release/assets/knowns-$p.tar.gz" | grep -Fx "./$exe" >/dev/null || { echo "FATAL: knowns-$p.tar.gz missing ./$exe"; exit 1; }
            echo "ok $p"
          done

          # ELF e_machine at offset 18: 3e00 = x86_64, b700 = aarch64.
          elf() { m=$(od -An -tx1 -j18 -N2 "$1" | tr -d ' '); [ "$m" = "$2" ] || { echo "FATAL: $1 ELF machine $m, expected $2"; exit 1; }; }
          elf release/npm/knowns-linux-x64/knowns 3e00
          elf release/npm/knowns-linux-arm64/knowns b700
          file release/npm/knowns-darwin-x64/knowns | grep -q "x86_64" || { echo "FATAL: darwin-x64 is not x86_64"; exit 1; }
          file release/npm/knowns-darwin-arm64/knowns | grep -q "arm64" || { echo "FATAL: darwin-arm64 is not arm64"; exit 1; }
          file release/npm/knowns-win-x64/knowns.exe | grep -q "x86-64" || { echo "FATAL: win-x64 is not x86-64"; exit 1; }
          file release/npm/knowns-win-arm64/knowns.exe | grep -qi "aarch64\|arm64" || { echo "FATAL: win-arm64 is not arm64"; exit 1; }

          node -p "JSON.stringify(require('./release/npm/knowns/package.json').optionalDependencies)"

      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PLATFORM_PKGS="knowns-darwin-arm64 knowns-darwin-x64 knowns-linux-arm64 knowns-linux-x64 knowns-win-arm64 knowns-win-x64"
          for pkg in $PLATFORM_PKGS; do
            (
              cd "release/npm/$pkg"
              PKG_NAME=$(node -p "require('./package.json').name")
              PKG_VERSION=$(node -p "require('./package.json').version")

              if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
                echo "Skipping ${PKG_NAME}@${PKG_VERSION} (already published)"
                exit 0
              fi

              for attempt in 1 2 3 4 5; do
                if npm publish --access public; then
                  exit 0
                fi

                echo "Publish failed for ${PKG_NAME}@${PKG_VERSION}, retry ${attempt}/5..."
                sleep 20

                if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
                  echo "${PKG_NAME}@${PKG_VERSION} is now visible, continuing"
                  exit 0
                fi
              done

              echo "Failed to publish ${PKG_NAME}@${PKG_VERSION} after retries"
              exit 1
            )
            sleep 10
          done

      - name: Publish main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd release/npm/knowns
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")

          if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "Skipping ${PKG_NAME}@${PKG_VERSION} (already published)"
            exit 0
          fi

          for attempt in 1 2 3 4 5; do
            if npm publish --provenance --access public; then
              exit 0
            fi

            echo "Publish failed for ${PKG_NAME}@${PKG_VERSION}, retry ${attempt}/5..."
            sleep 20

            if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
              echo "${PKG_NAME}@${PKG_VERSION} is now visible, continuing"
              exit 0
            fi
          done

          echo "Failed to publish ${PKG_NAME}@${PKG_VERSION} after retries"
          exit 1

      - name: Ensure GitHub release exists
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes

      # Same asset names as the 0.34.x Go releases, so pinned old versions keep resolving.
      - name: Upload binaries to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          for file in release/assets/*; do
            gh release upload "$TAG" "$file" --repo "$GITHUB_REPOSITORY" --clobber
          done

      - name: Update Homebrew tap
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN not set, skipping Homebrew update"
            exit 0
          fi

          SHA_DARWIN_ARM64=$(awk '{print $1}' release/assets/knowns-darwin-arm64.tar.gz.sha256)
          SHA_DARWIN_X64=$(awk '{print $1}' release/assets/knowns-darwin-x64.tar.gz.sha256)
          SHA_LINUX_X64=$(awk '{print $1}' release/assets/knowns-linux-x64.tar.gz.sha256)

          git clone https://x-access-token:${GH_TOKEN}@github.com/knowns-dev/homebrew-tap.git
          cd homebrew-tap

          cat > Formula/knowns.rb <<EOF
          class Knowns < Formula
            desc "The memory layer for AI-native software development"
            homepage "https://knowns.sh"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/knowns-dev/knowns/releases/download/v${VERSION}/knowns-darwin-arm64.tar.gz"
                sha256 "${SHA_DARWIN_ARM64}"
              end
              on_intel do
                url "https://github.com/knowns-dev/knowns/releases/download/v${VERSION}/knowns-darwin-x64.tar.gz"
                sha256 "${SHA_DARWIN_X64}"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/knowns-dev/knowns/releases/download/v${VERSION}/knowns-linux-x64.tar.gz"
                sha256 "${SHA_LINUX_X64}"
              end
            end

            def install
              bin.install "knowns"
              bin.install_symlink "knowns" => "kn"
            end

            test do
              assert_match version.to_s, shell_output("\#{bin}/knowns --version")
            end
          end
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/knowns.rb
          git commit -m "Update knowns to v${VERSION}" || echo "No changes to commit"
          git push

      - name: Get changelog from release
        if: github.event_name == 'release'
        id: changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          CHANGELOG=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q '.body' 2>/dev/null || echo "")
          CHANGELOG=$(echo "$CHANGELOG" | sed '/^\*\*Full Changelog\*\*:/d')
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="See full release notes on GitHub."
          fi
          if [ ${#CHANGELOG} -gt 1500 ]; then
            CHANGELOG="${CHANGELOG:0:1500}..."
          fi
          CHANGELOG=$(echo "$CHANGELOG" | jq -Rs .)
          echo "content=$CHANGELOG" >> "$GITHUB_OUTPUT"

      - name: Send Discord notification
        if: github.event_name == 'release' && success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERSION: ${{ needs.meta.outputs.version }}
          TAG: ${{ needs.meta.outputs.tag }}
          CHANGELOG: ${{ steps.changelog.outputs.content }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "Discord webhook not configured, skipping notification"
            exit 0
          fi

          curl -H "Content-Type: application/json" \
            -X POST \
            -d "{
              \"embeds\": [{
                \"title\": \"Knowns CLI v${VERSION} Released!\",
                \"description\": ${CHANGELOG},
                \"color\": 5814783,
                \"fields\": [
                  {
                    \"name\": \"Install/Update\",
                    \"value\": \"\`\`\`bash\\n# npm\\nnpm install -g knowns@${VERSION}\\n\\n# bun\\nbun add -g knowns@${VERSION}\\n\\n# brew\\nbrew upgrade knowns-dev/tap/knowns\\n\`\`\`\",
                    \"inline\": false
                  },
                  {
                    \"name\": \"Links\",
                    \"value\": \"[npm](https://www.npmjs.com/package/knowns/v/${VERSION}) | [GitHub Release](https://github.com/knowns-dev/knowns/releases/tag/${TAG}) | [Docs](https://knowns.sh/docs)\",
                    \"inline\": false
                  }
                ],
                \"footer\": {
                  \"text\": \"Knowns CLI\"
                },
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
              }]
            }" \
            "$DISCORD_WEBHOOK"
